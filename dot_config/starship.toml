# =============================================================================
#  Modus Vivendi Deuteranopia — a Starship theme
#  Based on Protesilaos Stavrou's "modus-vivendi-deuteranopia" Emacs theme
#  https://protesilaos.com/emacs/modus-themes
#
#  Modus Vivendi Deuteranopia is the dark, red-green-colorblind-optimized
#  variant of the Modus family. Instead of the usual red/green coding for
#  "bad/good", it relies on blue/yellow, which stays distinguishable for
#  people with deuteranopia and deuteranomaly. This theme carries that same
#  logic into Starship's git status coloring.
#
#  Palette reference (from the official modus-vivendi-deuteranopia palette):
#    bg-main       #000000
#    fg-main       #ffffff
#    fg-dim        #989898
#    fg-alt        #c6daff   (soft blue-tinted foreground)
#    border        #646464
#    blue-warmer   #79a8ff   (used for: clean/success, git branch)
#    yellow-warmer #fec43f   (used for: warnings, modified/dirty state)
#    magenta-cooler #b6a0ff  (used for: language versions)
#    cyan          #00d3d0   (used for: accents / staged files)
# =============================================================================

# Two-line prompt: modules on the first line, input character on the second.
# No blank line before the prompt.
add_newline = false

# Only these modules are active; everything else Starship ships with is
# implicitly disabled by leaving it out of `format`. Each module after the
# first prefixes itself with " - " so separators only show up between
# sections that actually render.
format = """
$directory\
$git_branch\
$git_status\
$c$rust$golang$nodejs$python$java$php$ruby$swift
$character"""

# ---------------------------------------------------------------------------
# Path
# ---------------------------------------------------------------------------
[directory]
style = "bold #c6daff"     # fg-alt
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = false   # always show 3 levels, even inside a repo
read_only = " 󰌾"
read_only_style = "#fec43f"

# ---------------------------------------------------------------------------
# Git branch
# ---------------------------------------------------------------------------
[git_branch]
symbol = ""
style = "bold #79a8ff"     # blue-warmer
format = "[ - $symbol$branch]($style)"

# ---------------------------------------------------------------------------
# Git status — blue for "fine", yellow for "needs attention"
# (deuteranopia-safe stand-ins for the usual green/red)
# ---------------------------------------------------------------------------
[git_status]
style = "bold #fec43f"     # yellow-warmer
format = '([ - $all_status$ahead_behind]($style))'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ---------------------------------------------------------------------------
# Language versions — one consistent accent so the prompt stays calm
# ---------------------------------------------------------------------------
[c]
symbol = ""
style = "bold #b6a0ff"     # magenta-cooler
format = "[ - $symbol($version)]($style)"

[rust]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[golang]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[nodejs]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[python]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[java]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[php]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[ruby]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

[swift]
symbol = ""
style = "bold #b6a0ff"
format = "[ - $symbol($version)]($style)"

# ---------------------------------------------------------------------------
# Prompt character — blue on success, yellow on error (no red/green)
# ---------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold #79a8ff)"
error_symbol = "[❯](bold #fec43f)"
vimcmd_symbol = "[❮](bold #b6a0ff)"
