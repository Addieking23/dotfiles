# ~/.config/kitty/open-actions.conf
#
# These rules apply to hyperlinks generated by programs such as:
#   ls --hyperlink=auto
#   kitten hyperlinked-grep
#   compilers/tools that emit terminal hyperlinks
#
# Hold Ctrl+Shift while clicking a hyperlink in Kitty.


# ============================================================
# Images
# ============================================================

# Display images directly inside Kitty.
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}


# ============================================================
# Text files
# ============================================================

# Open text files in your configured $EDITOR.
#
# ${EDITOR} is Kitty's configured editor when available.
protocol file
mime text/*
action launch --type=tab --cwd=current -- ${EDITOR} -- ${FILE_PATH}


# ============================================================
# PDFs
# ============================================================

# Open PDFs with the system's default application.
# macOS: open
# Linux: xdg-open
#
# Change this if you prefer a specific PDF viewer.

protocol file
mime application/pdf
action launch --type=os-window xdg-open ${FILE_PATH}


# ============================================================
# Directories
# ============================================================

# Open directories in a new Kitty window.
protocol file
mime inode/directory
action launch --type=os-window --cwd ${FILE_PATH}


# ============================================================
# Shell scripts
# ============================================================

# Run shell scripts in a new Kitty window.
# Kitty's shebang kitten handles the appropriate interpreter.

protocol file
ext sh,bash,zsh,fish
action launch --hold --type=os-window kitten __shebang__ confirm-always ${FILE_PATH} ${SHELL}


# ============================================================
# SSH URLs
# ============================================================

# Clicking ssh://user@host links opens them in Kitty.
protocol ssh
action launch --type=os-window kitten ssh -- ${URL}


# ============================================================
# HTTP / HTTPS
# ============================================================

# Let the OS/browser handle normal web links.
protocol http,https
action launch --type=os-window xdg-open ${URL}
