# vim:ft=kitty

# ============================================================
# Kitty Starter Configuration
# ~/.config/kitty/kitty.conf
# ============================================================

startup_session ~/.config/kitty/sessions/max.conf

# ------------------------------------------------------------
# Fonts
# ------------------------------------------------------------

# Change this to your preferred monospace font.
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0

shell_integration no-cursor


# ------------------------------------------------------------
# Appearance
# ------------------------------------------------------------

# Slight transparency (0.0 = invisible, 1.0 = solid)
# background_opacity 0.96

# Add breathing room around the terminal contents
# window_padding_width 8

# Nice cursor
cursor_shape block
cursor_blink_interval 0.75 ease-in-out
cursor_stop_blinking_after 0

# Disable terminal bell
enable_audio_bell no

# Confirm before closing windows with running programs
confirm_os_window_close 0


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

# tab_bar_edge top
# tab_bar_style powerline
# tab_powerline_style slanted

# tab_title_template "{title}"


# ------------------------------------------------------------
# Scrolling
# ------------------------------------------------------------

scrollback_lines 10000

# Faster wheel scrolling
wheel_scroll_multiplier 5.0


# ------------------------------------------------------------
# Clipboard
# ------------------------------------------------------------

# Allow terminal applications to access the system clipboard
clipboard_control write-clipboard write-primary


# ------------------------------------------------------------
# Window Management
# ------------------------------------------------------------

remember_window_size yes

# Start maximized if you prefer
# startup_session none
# initial_window_width 120c
# initial_window_height 35c


# ------------------------------------------------------------
# Remote Control
# ------------------------------------------------------------

# Enables "kitty @" automation commands
allow_remote_control yes


# ------------------------------------------------------------
# Shell
# ------------------------------------------------------------

# Usually unnecessary since Kitty uses your login shell.
# shell /opt/homebrew/bin/fish


# ------------------------------------------------------------
# Custom Keybindings
# ------------------------------------------------------------

map ctrl+shift+f5 load_config_file
map ctrl+shift+n new_os_window
map ctrl+shift+o new_tab_with_cwd

# ------------------------------------------------------------
# Tab bar
# ------------------------------------------------------------

# Position
tab_bar_edge top
tab_bar_min_tabs 0

# Style
tab_bar_style powerline
tab_powerline_style angled

# Spacing
tab_bar_margin_width 6
tab_bar_margin_height 3 3

# Titles
tab_title_template "{index}: {tab.active_exe}"

# Colors
active_tab_font_style bold
inactive_tab_font_style normal

# Window Decorations
hide_window_decorations yes

# ------------------------------------------------------------
# Includes
# ------------------------------------------------------------

# Keep future customizations organized.
# Uncomment as your config grows.

# include keybindings.conf
include ~/.config/kitty/theme.conf
# include work.conf
